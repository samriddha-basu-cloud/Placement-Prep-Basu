<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15161c">
<title>Placement Prep Vault</title>
<meta name="description" content="Read-only Obsidian-style study vault: SCM, Operations, Consulting, PM, Analytics.">

<script>
/* apply saved appearance before first paint (no theme flash) */
(function(){try{var p=JSON.parse(localStorage.getItem('prefs')||'null')||{},o=JSON.parse(localStorage.getItem('theme')||'null'),t=p.theme||(o==='light'||o==='dark'?o:'auto'),r=document.documentElement;
if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
r.dataset.theme=t;r.dataset.size=p.size==null?1:p.size;r.dataset.font=p.font||'sans';r.dataset.width=p.width==null?1:p.width;}catch(e){}})();

<style>
:root{
  --bg:#15161c;--bg2:#1b1c25;--bg3:#272938;--bd:#2f3243;--tx:#e9e8f1;--tx2:#b4b2c7;--tx3:#8985a3;
  --ac:#aa9cff;--ac2:#7c6cff;--acbg:rgba(150,128,255,.15);--ok:#4ade80;--warn:#fbbf24;
  --code:#101117;--shadow:0 14px 36px rgba(0,0,0,.5);
  --c-news:#f5b13d;--c-question:#6aa9ff;--c-tip:#3fd8a4;--c-note:#aa9cff;
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Source Serif 4",Charter,"Bitstream Charter",Georgia,Cambria,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
  --sbw:304px;--rpw:300px;--topH:52px;
  --base:17px;--scale:1;--measure:68ch;--gut:44px;
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#fdfcf9;--bg2:#f6f4ee;--bg3:#ebe8df;--bd:#e0dcd0;--tx:#24222c;--tx2:#4f4c66;--tx3:#66637a;
  --ac:#5a3de0;--ac2:#4a30cf;--acbg:rgba(90,61,224,.09);--ok:#17803f;--warn:#b45309;
  --code:#f3f1ea;--shadow:0 14px 36px rgba(40,34,70,.18);
  --c-news:#8f4b03;--c-question:#1f5fd6;--c-tip:#056b4c;--c-note:#5a3de0;
  color-scheme:light;
}
html[data-size="0"]{--scale:.9}html[data-size="2"]{--scale:1.12}html[data-size="3"]{--scale:1.26}
html[data-width="0"]{--measure:58ch}html[data-width="2"]{--measure:84ch}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ac);text-decoration:none}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px;border-radius:6px}
::selection{background:var(--acbg)}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:content-box;border:3px solid transparent}
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr) var(--rpw);height:100vh;height:100dvh}
#app.no-left{grid-template-columns:0 minmax(0,1fr) var(--rpw)}
#app.no-right{grid-template-columns:var(--sbw) minmax(0,1fr) 0}
#app.no-left.no-right{grid-template-columns:0 minmax(0,1fr) 0}
.pane{min-width:0;overflow:hidden;background:var(--bg2);display:flex;flex-direction:column}
#left{border-right:1px solid var(--bd)}#right{border-left:1px solid var(--bd)}
.no-left #left,.no-right #right{display:none}
#left{grid-column:1;grid-row:1}#main{grid-column:2;grid-row:1}#right{grid-column:3;grid-row:1}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 8px;font:650 15px/1.2 var(--sans);letter-spacing:.1px}
.brand svg{flex:none}
.brand small{display:block;font-weight:450;color:var(--tx3);font-size:12px;letter-spacing:0;margin-top:3px}
.progress-card{margin:8px 14px 10px;padding:10px 12px;background:var(--bg3);border-radius:10px;font-size:12.5px;color:var(--tx2)}
.bar{height:5px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ok));width:0;transition:width .3s}
.tabs{display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 4px 8px;color:var(--tx2);font-size:13.5px;font-weight:550;margin-bottom:-1px}
.tabs button:hover{color:var(--tx)}.tabs button.on{border-bottom-color:var(--ac2);color:var(--ac)}
.scroll{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}
#tree{padding:8px 8px 28px;font-size:13.5px;user-select:none}
.folder>.fh{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--tx);font-weight:600;font-size:13px;line-height:1.35}
.fh:hover,.file:hover{background:var(--bg3)}
.fh .chev{width:12px;color:var(--tx3);transition:transform .15s;flex:none;font-size:9px}
.folder.open>.fh .chev{transform:rotate(90deg)}
.fh .dot{width:9px;height:9px;border-radius:50%;flex:none}
.fh .cnt{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:450;font-variant-numeric:tabular-nums}
.folder>.kids{display:none;margin:2px 0 6px 15px;border-left:1px solid var(--bd);padding-left:4px}
.folder.open>.kids{display:block}
.file{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;cursor:pointer;color:var(--tx2);white-space:nowrap;overflow:hidden;line-height:1.4}
.file span.t{overflow:hidden;text-overflow:ellipsis;flex:1}
.file.on{background:var(--acbg);color:var(--ac);font-weight:550}
.file .ck{font-size:11px;color:var(--ok);flex:none}
.file.idx{font-style:italic;color:var(--tx3)}
.rootfiles{padding-bottom:6px;border-bottom:1px solid var(--bd);margin-bottom:6px}
#search{padding:12px}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:15px;outline:none}
#q:focus{border-color:var(--ac2);box-shadow:0 0 0 3px var(--acbg)}
.res{padding:10px 12px;border-radius:10px;cursor:pointer;margin-top:4px}
.res:hover{background:var(--bg3)}
.res b{display:block;font-size:13.5px;color:var(--tx);line-height:1.35}.res small{color:var(--tx3);font-size:11.5px}
.res p{margin:4px 0 0;font-size:12.5px;color:var(--tx2);line-height:1.5}
mark{background:rgba(251,191,36,.32);color:inherit;border-radius:3px;padding:0 1px}
.tagrow{display:flex;flex-wrap:wrap;gap:7px;padding:12px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--acbg);color:var(--ac);font-size:12px;border:0;cursor:pointer;line-height:1.6}
.tag small{opacity:.7;margin-left:3px}

/* ---------- main + top bar ---------- */
#main{background:var(--bg);position:relative}
#top{position:relative;display:flex;align-items:center;gap:2px;padding:0 10px;padding-top:env(safe-area-inset-top,0px);min-height:calc(var(--topH) + env(safe-area-inset-top,0px));border-bottom:1px solid var(--bd);background:var(--bg)}
#top .crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx3);font-size:13px;padding:0 8px}
#top .crumb b{color:var(--tx);font-weight:600}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:38px;height:38px;background:none;border:1px solid transparent;border-radius:10px;padding:0 10px;color:var(--tx2);font-size:13px;white-space:nowrap;flex:none}
.ib:hover{background:var(--bg3);color:var(--tx)}.ib.on{background:var(--acbg);color:var(--ac)}
.ib:disabled{opacity:.35;cursor:default;background:none}
.ib.studied{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
#progress{height:3px;background:transparent;flex:none}#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:0 3px 3px 0}
#content{flex:1;overflow:auto;position:relative;overscroll-behavior:contain;scroll-behavior:auto}
#note{--fs:calc(var(--base)*var(--scale));font-size:var(--fs);line-height:1.72;max-width:calc(var(--measure) + var(--gut)*2);margin:0 auto;padding:52px var(--gut) 140px}
html[data-font=serif] #note{font-family:var(--serif)}
.md{overflow-wrap:break-word}.md h1,.md h2,.md h3{overflow-wrap:anywhere}
#graphview{position:absolute;inset:0;display:none}
.showgraph #graphview{display:block}.showgraph #note{display:none}
#totop{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
#totop.show{opacity:1;pointer-events:auto;transform:none}.showgraph #totop{display:none}
.sheet{position:absolute;top:calc(100% + 6px);right:10px;z-index:45;width:min(348px,calc(100vw - 20px));background:var(--bg2);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow);padding:6px 16px 14px}
.sheet[hidden]{display:none}
.sheet .row{display:flex;flex-direction:column;gap:8px;padding:13px 0 0;margin-top:13px;border-top:1px solid var(--bd)}.sheet .row:first-child{border-top:0;margin-top:0;padding-top:8px}
.sheet .lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:7px 4px;color:var(--tx2);font-size:13px;font-weight:550;line-height:1.2}
.seg button.on{background:var(--bg);color:var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg.sizes button{font-family:var(--serif)}.seg.sizes button:nth-child(1){font-size:12px}.seg.sizes button:nth-child(2){font-size:15px}.seg.sizes button:nth-child(3){font-size:18px}.seg.sizes button:nth-child(4){font-size:21px}
.seg.fonts button[data-v=serif]{font-family:var(--serif);font-size:15px}

/* ---------- note header ---------- */
.eyebrow{display:flex;align-items:center;gap:9px;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin:0 0 14px}
.eyebrow i{width:9px;height:9px;border-radius:50%;flex:none}
.nmeta{display:flex;flex-wrap:wrap;gap:2px 14px;margin:0 0 6px;font:500 13px/1.5 var(--sans);color:var(--tx3)}
.nmeta span:not(:last-child)::after{content:"·";margin-left:14px;opacity:.7}
.ntags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.navline{font:450 13px/1.6 var(--sans)!important;color:var(--tx3);margin:1.1em 0!important;padding:.7em 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.navline a{color:var(--tx2)}.navline a:hover{color:var(--ac)}
.md blockquote.metaq{display:none}

/* ---------- markdown ---------- */
.md h1{font:650 2.35em/1.14 var(--serif);letter-spacing:-.022em;margin:.1em 0 .35em;text-wrap:balance}
.md h2{font:650 1.55em/1.25 var(--serif);letter-spacing:-.012em;margin:2.5em 0 .5em;text-wrap:balance;scroll-margin-top:16px}
.md h2[data-num]::before{content:attr(data-num);display:inline-block;margin-right:.6em;padding:.22em .62em;border-radius:7px;background:var(--acbg);color:var(--ac);font:650 .5em/1.3 var(--sans);letter-spacing:.04em;vertical-align:.32em;font-variant-numeric:tabular-nums}
.md h3{font:650 .72em/1.3 var(--sans);text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin:2em 0 .6em;scroll-margin-top:16px}
.md h3::before{content:"";display:inline-block;width:.72em;height:.72em;border-radius:50%;background:var(--tx3);margin-right:.65em;vertical-align:-.04em}
.md h3[data-k=definition]::before{background:var(--ac2)}.md h3[data-k=example]::before{background:var(--c-tip)}.md h3[data-k=in]::before{background:var(--c-news)}.md h3[data-k=interview]::before{background:var(--c-question)}
.md h4,.md h5,.md h6{font:650 1em/1.4 var(--sans);margin:1.4em 0 .3em}
.md h2+blockquote{margin:.1em 0 1.1em;padding:.55em .95em;border:0;border-radius:10px;background:var(--bg2);color:var(--tx2);font:450 .86em/1.55 var(--sans)}
.md h2+blockquote p{margin:0}
.md p{margin:.85em 0}
.md ul,.md ol{padding-left:1.4em;margin:.7em 0}.md li{margin:.32em 0;padding-left:.15em}.md li p{margin:.35em 0}
.md li::marker{color:var(--tx3)}
.md li>ul,.md li>ol{margin:.2em 0}
.md hr{border:0;border-top:1px solid var(--bd);margin:2.2em 0}
.md strong{color:var(--tx);font-weight:620}
.md code{background:var(--code);border:1px solid var(--bd);padding:.08em .38em;border-radius:6px;font:.84em var(--mono);color:var(--ac);word-break:break-word}
.md pre{position:relative;background:var(--code);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;overflow:auto;margin:1.1em 0;-webkit-overflow-scrolling:touch}
.md pre code{background:none;border:0;padding:0;color:var(--tx);font-size:.82em;line-height:1.65;display:block;white-space:pre;word-break:normal}
.md pre .lang{position:absolute;top:8px;right:62px;font:600 10.5px var(--sans);letter-spacing:.08em;color:var(--tx3);text-transform:uppercase}
.md pre .copy{position:absolute;top:6px;right:8px;font:550 11.5px var(--sans);background:var(--bg2);border:1px solid var(--bd);border-radius:7px;padding:2px 9px;color:var(--tx2);opacity:0;transition:.15s}
.md pre:hover .copy,.md pre .copy:focus-visible{opacity:1}
.tk-k{color:#c084fc}.tk-s{color:#4ade80}.tk-c{color:var(--tx3);font-style:italic}.tk-n{color:#fb923c}.tk-f{color:#60a5fa}.tk-r{color:#f472b6}
html[data-theme=light] .tk-k{color:#7e22ce}html[data-theme=light] .tk-s{color:#15803d}html[data-theme=light] .tk-n{color:#c2410c}html[data-theme=light] .tk-f{color:#1d4ed8}html[data-theme=light] .tk-r{color:#be185d}
.tablewrap{overflow:auto;margin:1.2em 0;border:1px solid var(--bd);border-radius:12px;-webkit-overflow-scrolling:touch;
  background:linear-gradient(to right,var(--bg) 30%,transparent) left center/36px 100% no-repeat local,linear-gradient(to left,var(--bg) 30%,transparent) right center/36px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.28),transparent) left center/10px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.28),transparent) right center/10px 100% no-repeat scroll}
.md table{border-collapse:collapse;width:100%;font:.88em/1.5 var(--sans)}
.md th,.md td{padding:9px 14px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.md th{font-weight:650;font-size:.82em;letter-spacing:.03em;color:var(--tx2);white-space:nowrap;border-bottom:1.5px solid var(--bd)}
.md tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg2) 55%,transparent)}
.md tr:last-child td{border-bottom:0}
.md td{min-width:80px}
.md blockquote{margin:1em 0;padding:.1em 1.1em;border-left:3px solid var(--ac2);color:var(--tx2)}
.callout{--cc:var(--c-note);margin:1.2em 0;border-radius:14px;padding:3px 18px 10px;background:color-mix(in srgb,var(--cc) 9%,var(--bg));border:1px solid color-mix(in srgb,var(--cc) 30%,transparent);border-left:4px solid var(--cc)}
.callout .ct{display:flex;gap:10px;align-items:flex-start;font:650 .92em/1.45 var(--sans);color:var(--cc);padding:10px 0 0}
.callout .ct svg{width:18px;height:18px;margin-top:.1em}
.callout .cb{font-size:.96em}
.callout .cb p:first-child{margin-top:.5em}.callout .cb ul,.callout .cb ol{margin:.4em 0}.callout .cb p:last-child{margin-bottom:.2em}
.callout.news{--cc:var(--c-news)}.callout.question{--cc:var(--c-question)}.callout.tip{--cc:var(--c-tip)}.callout.note,.callout.info{--cc:var(--c-note)}
a.wikilink{color:var(--ac);text-decoration:underline;text-decoration-style:dotted;text-decoration-color:color-mix(in srgb,var(--ac) 55%,transparent);text-underline-offset:3px}a.wikilink:hover{text-decoration-style:solid}
.md a:not(.wikilink){text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ac) 45%,transparent);text-underline-offset:3px}
.unresolved{color:var(--tx3);cursor:help;opacity:.8}
a.ext::after{content:"\2197";font-size:.8em;margin-left:2px}
.md input[type=checkbox]{margin-right:6px;accent-color:var(--ac2)}
.md li.task{list-style:none;margin-left:-1.3em}
.mathd{margin:1em 0;padding:.7em 1em;text-align:center;overflow-x:auto;font-size:1.1em;background:var(--bg2);border-radius:12px}
.mathi{white-space:nowrap}
.mathi.wide{display:block;overflow-x:auto;max-width:100%;margin:.55em 0;padding:.5em .85em;background:var(--bg2);border-radius:10px;-webkit-overflow-scrolling:touch}
.mathd,.mathi{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",Georgia,serif}
.mathd i,.mathi i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em}
.frac>.n{border-bottom:1.5px solid currentColor;padding:0 .2em .05em}.frac>.d{padding:.05em .2em 0}
.sqrt{display:inline-flex;align-items:stretch}.sqrt>.rad{align-self:flex-end;margin-right:-1px}.sqrt>.rb{border-top:1.5px solid currentColor;padding:0 .15em}
.scr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.72em;line-height:1.15;margin-left:1px}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1}.lim>.lt,.lim>.lb{font-size:.7em}
.ovl{display:inline-block;border-top:1.3px solid currentColor;line-height:1.05}
.ubr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}.ubr>.bd{border:solid currentColor;border-width:0 1.3px 1.3px;height:.4em;width:100%;border-radius:0 0 6px 6px}.ubr>.lb{font-size:.7em}
.tx{font-family:var(--sans);font-style:normal;font-size:.9em}
.fn{font-style:normal}
.hlchip{display:inline-flex;gap:6px;align-items:center;background:rgba(251,191,36,.18);border-radius:99px;padding:3px 12px;font:500 12px var(--sans);margin-bottom:14px}
.hlchip button{background:none;border:0;padding:0}
.subtoc{margin:1.6em 0 2.2em;padding:18px 22px 14px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;font-family:var(--sans)}
.subtoc summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font:650 11.5px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:2px 0 6px}
.subtoc summary::-webkit-details-marker{display:none}
.subtoc summary::after{content:"";margin-left:auto;width:7px;height:7px;border:solid currentColor;border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.subtoc[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.subtoc summary .cnt{font-weight:600;letter-spacing:0;background:var(--bg3);color:var(--tx2);border-radius:99px;padding:1px 8px}
.subtoc:not([open]){padding-bottom:12px}.subtoc:not([open]) summary{padding-bottom:0}
.subtoc[open] summary{margin-bottom:.5em}
.md .subtoc ol{margin:0;padding-left:1.7em;columns:2 300px;column-gap:36px;font-size:.88em;line-height:1.5}
.md .subtoc li{break-inside:avoid;margin:.32em 0;padding-left:.2em}
.md .subtoc li::marker{color:var(--tx3);font-variant-numeric:tabular-nums}
.md .subtoc a{color:var(--tx);text-decoration:none}.md .subtoc a:hover{color:var(--ac)}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4em;font-family:var(--sans)}
.navrow a{display:flex;flex-direction:column;gap:3px;padding:14px 18px;border:1px solid var(--bd);border-radius:14px;background:var(--bg2);font:600 14px/1.4 var(--sans);color:var(--tx);min-width:0}
.navrow a:hover{border-color:var(--ac2);background:var(--acbg)}
.navrow small{color:var(--tx3);font-weight:500;font-size:12px}.navrow a:last-child{text-align:right}
/* Home: long link lists flow into columns */
#note.home ul{columns:2 270px;column-gap:34px;list-style:none;padding-left:0}
#note.home li{break-inside:avoid;margin:.18em 0;font-size:.93em;line-height:1.45;padding:.12em 0}
#note.home h3{text-transform:none;letter-spacing:0;font:650 1.12em/1.35 var(--serif);color:var(--tx);margin:2em 0 .5em;padding-top:1em;border-top:1px solid var(--bd)}
#note.home h3::before{display:none}

/* ---------- right panel ---------- */
.rp{padding:16px 16px 14px;border-bottom:1px solid var(--bd)}
.rp h4{margin:0 0 10px;font:650 11px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);display:flex;justify-content:space-between;align-items:center}
#toc a{display:block;padding:5px 10px;border-left:2px solid var(--bd);color:var(--tx2);font-size:13px;line-height:1.4}
#toc a:hover{color:var(--tx)}#toc a.on{border-left-color:var(--ac2);color:var(--ac);background:var(--acbg);border-radius:0 8px 8px 0}
.bl{padding:8px 10px;border-radius:9px;margin-bottom:3px;cursor:pointer;font-size:13px;line-height:1.4}.bl:hover{background:var(--bg3)}
.bl small{display:block;color:var(--tx3);font-size:12px;line-height:1.4;margin-top:2px}
#localgraph{height:230px;position:relative;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.gui{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;z-index:2;max-width:268px}
.gpanel{background:color-mix(in srgb,var(--bg2) 94%,transparent);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:12.5px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.gpanel input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);outline:none;font:inherit;font-size:14px}
.gpanel label{display:flex;align-items:center;gap:7px;margin-top:8px;color:var(--tx2)}
.gpanel input[type=range]{flex:1;accent-color:var(--ac2)}
.gpanel input[type=checkbox]{accent-color:var(--ac2)}
.gtoggle{display:none;align-self:flex-start}
.legend{display:flex;flex-direction:column;gap:0;max-height:34vh;overflow:auto}
.legend div{display:flex;gap:8px;align-items:center;padding:4px 5px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--tx2)}
.legend div:hover{background:var(--bg3)}.legend div.off{opacity:.35}.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.gtitle{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:6px 14px;background:var(--bg2);border:1px solid var(--bd);border-radius:99px;font-size:12px;color:var(--tx2);pointer-events:none;z-index:2;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}

/* hover preview */
#pop{position:fixed;z-index:60;width:440px;max-width:92vw;max-height:310px;overflow:hidden;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shadow);padding:14px 18px;display:none;font-size:13.5px;line-height:1.6}
#pop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(transparent,var(--bg2))}
#pop .md h1{font-size:1.25em}#pop .md h2{font-size:1.1em;margin-top:.7em}#pop .md h2::before{display:none}#pop .md h3{font-size:.7em}
#pop .ph{font-size:11px;color:var(--tx3);margin-bottom:4px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--bd);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:70}
#toast.show{opacity:1}
#scrim{display:none}
.drawer-x{display:none;min-width:34px;height:34px;padding:0;margin-left:auto}
#left .brand .drawer-x{align-self:flex-start}

/* ---------- responsive ---------- */
/* <1280: right panel becomes a drawer; <900: sidebar becomes a drawer, single column */
@media (min-width:1280px){
  .showgraph #app,.showgraph #app.no-right{grid-template-columns:var(--sbw) minmax(0,1fr) 0}.showgraph #app.no-left,.showgraph #app.no-left.no-right{grid-template-columns:0 minmax(0,1fr) 0}.showgraph #right{display:none}
}
@media (max-width:1279px){

}

  #main{height:100vh;height:100dvh}
  #left{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(88vw,340px);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);display:flex!important;padding-top:env(safe-area-inset-top,0px)}
  .showleft #left{transform:none}
  .wide-only{display:none!important}

  .md h1{font-size:2em}
  .md h2{font-size:1.4em;margin-top:2.1em}
  .md td{min-width:160px}.md td:first-child{min-width:100px}

  .gtoggle{display:inline-flex}.gui.collapsed .gpanel{display:none}.gui{max-width:min(268px,calc(100vw - 24px))}
  .navrow{grid-template-columns:1fr}.navrow a:last-child{text-align:left}

@media (max-width:420px){

<script>
"use strict";
/* ============================================================
   Data
   ============================================================ */
const RAW = JSON.parse(document.getElementById('notes-data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const NARROW_L = matchMedia('(max-width:899px)'), NARROW_R = matchMedia('(max-width:1279px)');
const COARSE = matchMedia('(pointer:coarse)').matches, REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const IC = p => `<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const CALLOUT_ICON = {
  news: IC('<path d="M4 5h13a1 1 0 0 1 1 1v13H5a1 1 0 0 1-1-1z"/><path d="M18 9h2v9a1.5 1.5 0 0 1-3 0M7.5 9h7M7.5 12.5h7M7.5 16h4"/>'),
  question: IC('<circle cx="12" cy="12" r="9"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1 1-1.1 1.8M12 17h.01"/>'),
  tip: IC('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'),
  note: IC('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  warning: IC('<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>'),
  example: IC('<path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4A1.5 1.5 0 0 0 19 19l-5-10V3"/>')
};
const HINT = COARSE ? 'Pinch to zoom · drag to pan · tap a note to open · green ring = studied' : 'Scroll to zoom · drag to pan · drag a node · click to open · green ring = studied';
const PALETTE = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#4ade80', '#2dd4bf', '#22d3ee', '#60a5fa', '#818cf8', '#a78bfa', '#e879f9', '#f472b6', '#fb7185', '#34d399', '#38bdf8'];
const folders = [...new Set(RAW.map(n => n.folder).filter(Boolean))].sort();
const folderLabel = f => f ? f.replace(/^\d+\s+/, '') : 'Vault root';
const folderColor = f => f ? PALETTE[folders.indexOf(f) % PALETTE.length] : '#9ca3af';

function parseFront(md) {
  const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  const fm = {}; let body = md;
  if (m) {
    body = md.slice(m[0].length);
    m[1].split(/\r?\n/).forEach(l => {
      const k = l.match(/^([\w-]+):\s*(.*)$/); if (!k) return;
      let v = k[2].trim();
      if (/^\[.*\]$/.test(v)) v = v.slice(1, -1).split(',').map(x => x.trim()).filter(Boolean);
      else v = v.replace(/^["']|["']$/g, '');
      fm[k[1]] = v;
    });
  }
  return { fm, body };
}

const GRAPHS = new Set();
const NOTES = {}; const ORDER = [];
RAW.forEach(r => {
  const { fm, body } = parseFront(r.md);
  const title = r.id.replace(/^_Index - /, '');
  const n = { id: r.id, folder: r.folder, fm, body, title, isIndex: r.id.startsWith('_Index'), color: folderColor(r.folder),
    tags: [].concat(fm.tags || []), low: body.toLowerCase(), out: new Set(), in: new Set() };
  NOTES[r.id] = n; ORDER.push(n.id);
});
const LOOKUP = {}; ORDER.forEach(id => LOOKUP[id.toLowerCase()] = id);
function resolve(name) {
  if (!name) return null;
  name = name.trim().replace(/\.md$/i, '').split('/').pop();
  return LOOKUP[name.toLowerCase()] || null;
}
/* link graph */
const EDGES = [];
ORDER.forEach(id => {
  const n = NOTES[id]; n.ctx = {};
  const text = n.body.replace(/```[\s\S]*?```/g, '');
  const re = /\[\[([^\]|#]*)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g; let m;
  text.split('\n').forEach(line => {
    re.lastIndex = 0;
    while ((m = re.exec(line))) {
      const t = resolve(m[1]); if (!t || t === id) continue;
      n.out.add(t); if (!n.ctx[t]) n.ctx[t] = line;
    }
  });
});
ORDER.forEach(id => NOTES[id].out.forEach(t => { NOTES[t].in.add(id); EDGES.push([id, t]); }));
/* undirected unique edges for graph */
const UEDGES = (() => { const s = new Set(), out = []; EDGES.forEach(([a, b]) => { const k = a < b ? a + '\0' + b : b + '\0' + a; if (!s.has(k)) { s.add(k); out.push([a, b]); } }); return out; })();
const NEIGH = {}; ORDER.forEach(id => NEIGH[id] = new Set());
UEDGES.forEach(([a, b]) => { NEIGH[a].add(b); NEIGH[b].add(a); });

/* reading order: Home, then each folder's index + notes, then root extras */
const READ = [];
['00 Home'].forEach(i => NOTES[i] && READ.push(i));
folders.forEach(f => ORDER.filter(i => NOTES[i].folder === f).sort().forEach(i => READ.push(i)));
ORDER.filter(i => !NOTES[i].folder && !READ.includes(i)).sort().forEach(i => READ.push(i));

/* ============================================================
   LaTeX → HTML (small subset, no dependencies)
   ============================================================ */
const SYM = {
  alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ϵ',varepsilon:'ε',zeta:'ζ',eta:'η',theta:'θ',vartheta:'ϑ',iota:'ι',kappa:'κ',lambda:'λ',mu:'μ',nu:'ν',xi:'ξ',pi:'π',rho:'ρ',sigma:'σ',tau:'τ',upsilon:'υ',phi:'φ',varphi:'φ',chi:'χ',psi:'ψ',omega:'ω',
  Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Xi:'Ξ',Pi:'Π',Sigma:'Σ',Phi:'Φ',Psi:'Ψ',Omega:'Ω',
  times:'×',cdot:'·',div:'÷',pm:'±',mp:'∓',approx:'≈',neq:'≠',ne:'≠',le:'≤',leq:'≤',ge:'≥',geq:'≥',ll:'≪',gg:'≫',to:'→',rightarrow:'→',Rightarrow:'⇒',leftarrow:'←',leftrightarrow:'↔',Leftrightarrow:'⇔',implies:'⇒',
  infty:'∞',partial:'∂',nabla:'∇',in:'∈',notin:'∉',subset:'⊂',subseteq:'⊆',cap:'∩',cup:'∪',propto:'∝',sim:'∼',simeq:'≃',equiv:'≡',cdots:'⋯',ldots:'…',dots:'…',vdots:'⋮',mid:'|',perp:'⊥',circ:'∘',prime:'′',ell:'ℓ',forall:'∀',exists:'∃',neg:'¬',land:'∧',lor:'∨',
  lfloor:'⌊',rfloor:'⌋',lceil:'⌈',rceil:'⌉',langle:'⟨',rangle:'⟩',star:'⋆',bullet:'•',checkmark:'✓',therefore:'∴',emptyset:'∅',
  quad:' ',qquad:'  ',',':' ',';':' ',':':' ','!':'','\\':' ',' ':' ','%':'%','&':'&','$':'$','#':'#','_':'_','{':'{','}':'}','|':'‖'
};
const FUNCS = new Set(['log','ln','exp','min','max','sin','cos','tan','lim','sup','inf','arg','det','Pr','gcd','mod','argmax','argmin','var','cov','corr','E','sgn','softmax']);
const BIGOP = { sum:'∑', prod:'∏', int:'∫', lim:'lim', max:'max', min:'min', sup:'sup', inf:'inf', argmax:'argmax', argmin:'argmin' };
function texToHtml(src) {
  let i = 0; const s = src;
  const skipWs = () => { while (i < s.length && /\s/.test(s[i])) i++; };
  function group() { skipWs(); if (s[i] === '{') { i++; const h = seq('}'); if (s[i] === '}') i++; return h; } return atom(); }
  function rawGroup() { skipWs(); if (s[i] !== '{') { return s[i++] || ''; } let d = 0, st = ++i; for (; i < s.length; i++) { if (s[i] === '{') d++; else if (s[i] === '}') { if (!d) break; d--; } } const r = s.slice(st, i); i++; return r; }
  function seq(end) {
    let out = '';
    while (i < s.length && s[i] !== end) {
      if (s[i] === '}' ) { i++; continue; }
      const a = atomWithScripts(); out += a;
    }
    return out;
  }
  function atomWithScripts() {
    skipWs(); if (i >= s.length || s[i] === '}') return '';
    const startI = i;
    let base = atom(); let isBig = false, under = false, bigName = '';
    const m = s.slice(startI).match(/^\\([a-zA-Z]+)/);
    if (m && BIGOP[m[1]] !== undefined) { isBig = true; bigName = m[1]; }
    if (m && (m[1] === 'underbrace' || m[1] === 'overbrace')) under = m[1];
    let sup = null, sub = null;
    for (;;) {
      skipWs();

let LOCAL = null, BIG = null;
function localIds(id, depth = 1) { const s = new Set([id]); let fr = [id]; for (let d = 0; d < depth; d++) { const nx = []; fr.forEach(x => NEIGH[x].forEach(y => { if (!s.has(y)) { s.add(y); nx.push(y); } })); fr = nx; } return [...s]; }

  const ids = NEIGH[CURID].size > 40 ? [CURID, ...[...NEIGH[CURID]].sort((a, b) => NEIGH[b].size - NEIGH[a].size).slice(0, 40)] : localIds(CURID, 1);

function showGraphView(on) {

  if (on) {

function buildBigGraph() {
  const host = $('#graphview');
  host.innerHTML = `<div class="gui collapsed" id="gui"><button class="ib gtoggle" id="g-toggle" style="border-color:var(--bd);background:var(--bg2)">Filters &amp; legend</button><div class="gpanel"><input type="text" id="gf" placeholder="Filter notes…">

    <label>Repel <input type="range" id="g-rep" min=".3" max="3" step=".1" value="1"></label>
    <label>Link distance <input type="range" id="g-link" min=".4" max="3" step=".1" value="1"></label>
    <label>Node size <input type="range" id="g-size" min=".6" max="2.2" step=".1" value="1"></label>
    <label style="justify-content:space-between"><button class="ib" id="g-fit" style="border-color:var(--bd)">Fit</button><button class="ib" id="g-re" style="border-color:var(--bd)">Re-layout</button></label></div>
    <div class="gpanel legend" id="legend"></div></div><div class="gtitle" id="gtitle">${HINT}</div>`;
  BIG = new Graph(host, { ids: ORDER, opt: { hideHubs: true }, focusId: CURID, onOpen: id => go(id), onHover: id => { $('#gtitle').textContent = id ? `${NOTES[id].isIndex ? "Index · " + folderLabel(NOTES[id].folder) : id} · ${NOTES[id].in.size} backlinks · ${NOTES[id].out.size} links` : HINT; } });
  const lg = $('#legend'); lg.innerHTML = [...folders, ''].map(f => `<div data-f="${esc(f)}"><i style="background:${folderColor(f)}"></i>${esc(folderLabel(f))}</div>`).join('');

}

document.addEventListener('keydown', e => {
